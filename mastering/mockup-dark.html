<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>マスタリング — 夜のドライブ</title>
<style>
:root{
  --bg:#04060d;
  --bg2:#070b16;
  --card:#0a1120;
  --card2:#0c1424;
  --line:rgba(120,158,224,.14);
  --line-soft:rgba(120,158,224,.09);
  --ink:#eef3fb;
  --mute:#7c879b;
  --mute2:#5c6274;
  --blue:#2f83ff;
  --blue-hi:#5aa6ff;
  --blue-deep:#1a67f0;
  --cyan:#8fd2ff;
  --purple:#a78bfa;
  --purple-hi:#c4b4ff;
  --shadow-blue:0 14px 40px -12px rgba(37,110,255,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
.app{
  position:relative;
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  padding:14px 20px calc(20px + env(safe-area-inset-bottom));
  background:
    radial-gradient(120% 60% at 50% -8%, rgba(28,66,140,.42) 0%, rgba(12,28,64,.16) 34%, transparent 62%),
    radial-gradient(90% 40% at 88% 6%, rgba(96,72,190,.18) 0%, transparent 50%),
    var(--bg);
  display:flex;flex-direction:column;gap:16px;
  overflow:hidden;
}
.app::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(140% 80% at 50% 120%, rgba(20,44,96,.28) 0%, transparent 55%);
}
.app>*{position:relative;z-index:1}

/* ── top bar ── */
.topbar{display:flex;align-items:center;height:40px;margin-top:4px}
.topbar .back{width:34px;height:34px;display:flex;align-items:center;justify-content:center;margin-left:-6px;color:#c7d1e4}
.topbar .title{flex:1;text-align:center;font-size:19px;font-weight:700;letter-spacing:.04em}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(18,28,48,.5);display:flex;align-items:center;justify-content:center;color:#aab6cc}

/* ── song title ── */
.song{display:flex;align-items:baseline;gap:14px;padding:0 2px}
.song .lbl{font-size:14px;color:var(--mute);font-weight:600}
.song .name{font-size:23px;font-weight:700;letter-spacing:.02em}

/* ── stat cards ── */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{
  position:relative;border-radius:18px;padding:16px 14px 14px;
  background:linear-gradient(180deg,rgba(20,32,56,.55),rgba(10,17,32,.55));
  border:1px solid var(--line);
  display:flex;align-items:center;gap:clamp(9px,2.4vw,12px);overflow:hidden;
}
.stat.lufs{border-color:rgba(60,120,240,.34);box-shadow:inset 0 0 0 1px rgba(60,120,240,.05),0 8px 26px -16px rgba(40,110,255,.6)}
.stat.peak{border-color:rgba(150,120,250,.30)}
.stat .badge{flex:none;width:clamp(42px,11vw,50px);height:clamp(42px,11vw,50px);border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(30,48,84,.9),rgba(12,20,38,.9));border:1px solid rgba(120,160,240,.22)}
.stat.peak .badge{border-color:rgba(160,130,250,.28)}
.stat .meta{min-width:0}
.stat .val{display:flex;align-items:baseline;gap:5px;line-height:1}
.stat .val .num{font-size:clamp(29px,7.5vw,35px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .val .unit{font-size:clamp(12px,3vw,14px);font-weight:700}
.stat.lufs .unit{color:var(--blue-hi)}
.stat.peak .unit{color:var(--purple-hi)}
.stat .cap{margin-top:7px;font-size:clamp(10px,2.75vw,12px);font-weight:600;white-space:nowrap}
.stat.lufs .cap{color:#6f9adf}
.stat.peak .cap{color:#9a8ede}

/* ── waveform card ── */
.wavecard{
  position:relative;border-radius:18px;
  background:linear-gradient(180deg,rgba(9,15,28,.9),rgba(6,10,20,.9));
  border:1px solid var(--line);
  padding:14px 14px 12px;overflow:hidden;
}
.wavecard canvas{display:block;width:100%;height:330px}

/* ── preset buttons ── */
.presets{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.preset{
  border:1px solid var(--line);border-radius:15px;
  background:linear-gradient(180deg,rgba(18,28,48,.5),rgba(11,18,33,.6));
  padding:15px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer;
  transition:transform .18s ease,border-color .2s ease,background .2s ease;
}
.preset .pi{width:26px;height:26px;color:#93a1ba;display:flex;align-items:center;justify-content:center}
.preset .pl{font-size:clamp(10.5px,3vw,12.5px);font-weight:600;color:#aeb9cd;letter-spacing:.01em;white-space:nowrap}
.preset:active{transform:scale(.96)}
.preset.on{
  background:linear-gradient(180deg,#3a8bff,#1f6cf1);
  border-color:rgba(150,195,255,.6);
  box-shadow:0 12px 30px -10px rgba(40,120,255,.7),inset 0 1px 0 rgba(255,255,255,.25);
}
.preset.on .pi{color:#fff}
.preset.on .pl{color:#fff;font-weight:700}

/* ── clarity toggle ── */
.clarity{
  display:flex;align-items:center;gap:13px;
  border:1px solid var(--line);border-radius:15px;
  background:linear-gradient(180deg,rgba(16,25,44,.5),rgba(10,16,30,.6));
  padding:16px 18px;cursor:pointer;
}
.clarity .ci{width:24px;height:24px;color:var(--blue-hi);flex:none}
.clarity .ct{font-size:16px;font-weight:700}
.clarity .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.clarity .state{font-size:14px;font-weight:800;color:var(--blue-hi);letter-spacing:.06em}
.switch{width:56px;height:31px;border-radius:999px;background:#1a2438;border:1px solid rgba(120,160,240,.18);position:relative;transition:background .25s ease,border-color .25s ease}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .25s cubic-bezier(.3,.7,.3,1)}
.clarity input{position:absolute;opacity:0;pointer-events:none}
.clarity input:checked~.right .switch{background:linear-gradient(180deg,#3a8bff,#1f6cf1);border-color:rgba(150,195,255,.5);box-shadow:0 0 18px -4px rgba(45,131,255,.7)}
.clarity input:checked~.right .switch::after{transform:translateX(25px)}

/* ── advanced ── */
.advbtn{
  border:1px solid var(--line);border-radius:15px;
  background:linear-gradient(180deg,rgba(14,22,40,.45),rgba(9,15,28,.55));
  padding:15px;text-align:center;font-size:15px;font-weight:600;color:#9aa6bc;cursor:pointer;letter-spacing:.03em;
}
.advbtn .cv{display:inline-block;margin-left:4px;font-size:11px;transform:translateY(-1px)}

/* ── run button ── */
.run{
  margin-top:2px;border:none;border-radius:17px;cursor:pointer;
  background:linear-gradient(180deg,#4a95ff 0%,#2f83ff 42%,#1f6cf1 100%);
  color:#fff;font-family:inherit;font-size:20px;font-weight:800;letter-spacing:.06em;
  padding:19px;display:flex;align-items:center;justify-content:center;gap:12px;
  box-shadow:var(--shadow-blue),inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .18s ease,box-shadow .2s ease;
}
.run:active{transform:translateY(1px) scale(.995)}
.run svg{width:24px;height:24px}

/* ── footer note ── */
.note{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mute);font-size:13px;font-weight:500;margin-top:-2px}
.note svg{width:15px;height:15px;opacity:.8}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:360px){
  .stat .val .num{font-size:36px}
  .preset .pl{font-size:11px}
}
</style>
</head>
<body>
<div class="app">

  <!-- top bar -->
  <div class="topbar">
    <span class="back" aria-label="戻る">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </span>
    <span class="title">マスタリング</span>
    <span class="icon-btn" aria-label="メニュー">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
    </span>
  </div>

  <!-- song title -->
  <div class="song"><span class="lbl">曲名</span><span class="name">夜のドライブ</span></div>

  <!-- stat cards -->
  <div class="stats">
    <div class="stat lufs">
      <span class="badge">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4d95ff" stroke-width="2" stroke-linecap="round"><path d="M5 14v3M9 10v7M13 6v11M17 12v5M21 9v4" transform="translate(-1 0)"/></svg>
      </span>
      <span class="meta">
        <span class="val"><span class="num">-14.7</span><span class="unit">LUFS</span></span>
        <span class="cap">ラウドネス（音圧）</span>
      </span>
    </div>
    <div class="stat peak">
      <span class="badge">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l2.5-6 4 13 2.5-9 2 4H21"/></svg>
      </span>
      <span class="meta">
        <span class="val"><span class="num">-1.4</span><span class="unit">dBFS</span></span>
        <span class="cap">ピーク</span>
      </span>
    </div>
  </div>

  <!-- waveform -->
  <div class="wavecard"><canvas id="wave" width="880" height="660"></canvas></div>

  <!-- presets -->
  <div class="presets" id="presets">
    <button class="preset" data-k="natural">
      <span class="pi"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 18 4h3v3a7 7 0 0 1-7 7h-3z"/><path d="M6 20c1-4 3-6 8-8"/></svg></span>
      <span class="pl">ナチュラル</span>
    </button>
    <button class="preset" data-k="loud">
      <span class="pi"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 20v-6M12 20V8M18 20v-9"/></svg></span>
      <span class="pl">ラウド</span>
    </button>
    <button class="preset" data-k="warm">
      <span class="pi"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></span>
      <span class="pl">ウォーム</span>
    </button>
    <button class="preset on" data-k="clear">
      <span class="pi"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 6.1L20 11l-6.1 1.9L12 19l-1.9-6.1L4 11l6.1-1.9z"/></svg></span>
      <span class="pl">クリア</span>
    </button>
    <button class="preset" data-k="punch">
      <span class="pi"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 8h6a4 4 0 0 1 4 4v1a4 4 0 0 1-4 4h-1"/><path d="M9 8V6.5A2.5 2.5 0 0 1 11.5 4h1A2.5 2.5 0 0 1 15 6.5V8"/><rect x="5" y="8" width="4" height="9" rx="1.4"/><path d="M14 17v1.5A2.5 2.5 0 0 1 11.5 21h-3"/></svg></span>
      <span class="pl">パンチ</span>
    </button>
  </div>

  <!-- clarity toggle -->
  <label class="clarity">
    <span class="ci"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L7 10l5.3-1.7z"/><path d="M19 14l.8 2.4L22 17l-2.2.6L19 20l-.8-2.4L16 17l2.2-.6z"/></svg></span>
    <span class="ct">クリアさ</span>
    <input type="checkbox" id="clarityChk" checked>
    <span class="right"><span class="switch"></span><span class="state" id="clarityState">ON</span></span>
  </label>

  <!-- advanced -->
  <div class="advbtn">詳細設定<span class="cv">▼</span></div>

  <!-- run -->
  <button class="run">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M4 17h5M15 12h5M11 12H4"/><circle cx="16" cy="7" r="2.4"/><circle cx="12" cy="17" r="2.4"/><circle cx="8.5" cy="12" r="2.4"/></svg>
    マスタリング開始
  </button>

  <!-- footer note -->
  <div class="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.4-3 7.5-7 9-4-1.5-7-4.6-7-9V6z"/></svg>
    オリジナル音源は変更されません
  </div>

</div>

<script>
'use strict';
/* ── preset selection ── */
document.getElementById('presets').addEventListener('click',e=>{
  const b=e.target.closest('.preset');if(!b)return;
  document.querySelectorAll('.preset').forEach(p=>p.classList.toggle('on',p===b));
});
const chk=document.getElementById('clarityChk');
chk.addEventListener('change',()=>{document.getElementById('clarityState').textContent=chk.checked?'ON':'OFF';});

/* ── waveform + axes + LED meter, drawn on canvas for exact fidelity ── */
const cv=document.getElementById('wave');
function draw(){
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  const cssW=cv.clientWidth,cssH=cv.clientHeight;
  cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,cssW,cssH);

  const AX_L=30, AX_R=30, MET_W=9, MET_GAP=11;
  const rulerH=24;
  const plotL=AX_L;
  const plotR=cssW-AX_R-MET_W-MET_GAP;
  const plotT=rulerH+6;
  const plotB=cssH-6;
  const plotH=plotB-plotT, plotW=plotR-plotL;
  const midY=plotT+plotH/2;

  g.font='500 10px "Hiragino Kaku Gothic ProN",-apple-system,sans-serif';
  g.textBaseline='middle';

  // ── dB axis (0 .. -48) both sides ──
  const dbs=[0,-6,-12,-18,-24,-30,-36,-42,-48];
  g.fillStyle='#5e6a80';
  dbs.forEach(db=>{
    const y=plotT+ (-db/48)*plotH;
    g.textAlign='right'; g.fillText(String(db),plotL-6,y);
    g.textAlign='left';  g.fillText(String(db),plotR+6,y);
  });

  // ── time ruler ticks + labels ──
  const totalSec=185; // ~3:05
  const majorEvery=30;
  g.strokeStyle='rgba(120,140,175,.5)';g.lineWidth=1;
  g.beginPath();
  for(let s=0;s<=totalSec;s+=5){
    const x=plotL+ (s/totalSec)*plotW;
    const major=(s%majorEvery===0);
    const h=major?7:3.5;
    g.moveTo(Math.round(x)+.5,rulerH-h);g.lineTo(Math.round(x)+.5,rulerH);
  }
  g.stroke();
  g.fillStyle='#6b7488';g.textBaseline='alphabetic';
  for(let s=0;s<=180;s+=30){
    const x=plotL+ (s/totalSec)*plotW;
    const mm=Math.floor(s/60),ss=String(s%60).padStart(2,'0');
    const lbl=mm+':'+ss;
    g.textAlign = s===0?'left':(s>=180?'right':'center');
    g.fillText(lbl, s===0?plotL:(s>=180?Math.min(x,plotR):x), rulerH-11);
  }

  // ── vertical dashed gridlines at each 30s ──
  g.strokeStyle='rgba(90,120,170,.16)';g.lineWidth=1;g.setLineDash([4,5]);
  for(let s=30;s<180;s+=30){
    const x=Math.round(plotL+(s/totalSec)*plotW)+.5;
    g.beginPath();g.moveTo(x,plotT);g.lineTo(x,plotB);g.stroke();
  }
  g.setLineDash([]);

  // ── waveform envelope ──
  // shape: quiet intro w/ small bursts -> build -> sustained loud -> taper -> final spike
  function env(t){ // t in 0..1
    const sec=t*totalSec;
    let a;
    if(sec<8)      a=.34+.10*Math.sin(sec*3);
    else if(sec<20)a=.16+.05*Math.sin(sec*2);
    else if(sec<44)a=.22+ (sec-20)/24*.28 + .05*Math.sin(sec*2.4);
    else if(sec<58)a=.5+ (sec-44)/14*.34;
    else if(sec<165)a=.82+.14*Math.sin(sec*1.7)+.05*Math.sin(sec*5.1);
    else if(sec<176)a=.86 - (sec-165)/11*.5;
    else if(sec<179)a=.36+ (sec-176)/3*.5; // final spike
    else            a=Math.max(0,.86-(sec-179)*.42);
    return Math.max(.02,Math.min(1,a));
  }
  const N=Math.round(plotW*2.5);
  let seed=20240706;
  const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  // outer body (blue) then inner core (cyan). F sets overall amplitude (loud≈0.30*plotH peaks)
  const F=0.35;
  function pass(mult,color,glow,wid){
    g.strokeStyle=color;g.lineWidth=wid;g.lineCap='round';
    g.shadowColor=glow;g.shadowBlur=glow?6:0;
    g.beginPath();
    for(let i=0;i<N;i++){
      const t=i/(N-1);
      const base=env(t);
      const jag=base*(0.5+0.5*rnd());
      const amp=jag*mult*(plotH*F);
      const x=plotL + t*plotW;
      g.moveTo(x,midY-amp);g.lineTo(x,midY+amp);
    }
    g.stroke();g.shadowBlur=0;
  }
  seed=20240706; pass(1.0,'rgba(46,120,230,.85)','rgba(40,110,235,.5)',1.1);
  seed=20240706; pass(0.44,'rgba(158,218,255,.95)','rgba(120,200,255,.45)',1.0);
  // center hairline
  g.strokeStyle='rgba(150,210,255,.28)';g.lineWidth=1;
  g.beginPath();g.moveTo(plotL,midY+.5);g.lineTo(plotR,midY+.5);g.stroke();

  // ── LED meter ──
  const mx=cssW-MET_W;
  const segN=34, segGap=2.2;
  const segH=(plotH-(segN-1)*segGap)/segN;
  for(let i=0;i<segN;i++){
    const f=i/(segN-1); // 0 bottom .. 1 top
    const y=plotB - i*(segH+segGap) - segH;
    let col;
    if(f>0.955)      col='#ff4b4b';
    else if(f>0.9)   col='#ff7a3d';
    else if(f>0.83)  col='#ffc24d';
    else if(f>0.72)  col='#d7ecff';
    else if(f>0.5)   col='#5aa6ff';
    else             col='rgba(46,110,220,'+(0.4+0.5*f).toFixed(2)+')';
    g.fillStyle=col;
    if(f>0.9){g.shadowColor=col;g.shadowBlur=6;}else g.shadowBlur=0;
    roundRect(g,mx,y,MET_W,segH,2);g.fill();
  }
  g.shadowBlur=0;
}
function roundRect(g,x,y,w,h,r){r=Math.min(r,h/2,w/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
draw();
window.addEventListener('resize',draw);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
</script>
</body>
</html>
